<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>History</title>
<style>body{margin:0;background:#050a14;color:white;font-family:sans-serif;padding:20px}
.card{background:white;color:#0a2540;border-radius:16px;padding:20px;max-width:400px;margin:auto}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:13px}
a{color:#d4af37;text-decoration:none}</style></head><body>
<a href="/dashboard">← Kembali</a>
<div class="card"><h3>RIWAYAT TRANSAKSI</h3>
{% for t in tx %}
<div class="item"><span>{{ t['from_user'] }} → {{ t['to_user'] }}<br><small>{{ t['note'] }} • {{ t['created_at'] }}</small></span><span style="font-weight:700;color:{% if t['from_user']==user['username'] %}#dc2626{% else %}#059669{% endif %}">{% if t['from_user']==user['username'] %}-{% else %}+{% endif %} Rp {{ "{:,}".format(t['amount']).replace(',', '.') }}</span></div>
{% else %}<p style="font-size:13px;color:#6b7280">Belum ada transaksi</p>{% endfor %}
</div></body></html>
