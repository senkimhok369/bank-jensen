<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scan QRIS</title><link rel="manifest" href="/static/manifest.json"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#050a14;color:white;font-family:sans-serif;padding:20px;text-align:center}.card{background:#0a1931;border:1px solid #d4af37;border-radius:20px;padding:20px;max-width:400px;margin:auto}#reader{border-radius:16px;overflow:hidden}</style></head><body><a href="/dashboard" style="color:#d4af37;text-decoration:none">← Kembali</a><h3>📷 SCAN QRIS</h3><div class="card"><div id="reader" style="width:100%"></div><p id="result" style="color:#d4af37">Arahkan kamera ke QRIS teman</p><div id="action" style="display:none"><a id="transferBtn" href="#" style="display:inline-block;padding:12px 24px;background:#d4af37;color:#0a2540;border-radius:10px;text-decoration:none;font-weight:900">TRANSFER →</a></div></div><script>
function onScanSuccess(d){document.getElementById('result').innerText="Terdeteksi: "+d;let to=null,am=null;try{let u=new URL(d);to=u.searchParams.get('to');am=u.searchParams.get('amount')}catch(e){if(d.includes('bankjensen://')){let q=d.split('?')[1];let p=new URLSearchParams(q);to=p.get('to');am=p.get('amount')}}if(to){let l=`/transfer?to=${to}`+(am?`&amount=${am}`:'');document.getElementById('transferBtn').href=l;document.getElementById('action').style.display='block';html5QrcodeScanner.clear()}}
let html5QrcodeScanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250}});html5QrcodeScanner.render(onScanSuccess);
</script></body></html>
