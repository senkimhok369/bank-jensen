<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QRIS</title><link rel="manifest" href="/static/manifest.json"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#050a14;color:white;font-family:sans-serif;padding:20px;text-align:center}.card{background:white;color:#0a2540;border-radius:24px;padding:25px;max-width:340px;margin:20px auto}input{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid #ddd}</style></head><body><a href="/dashboard" style="color:#d4af37;text-decoration:none">← Kembali</a> • <a href="/scan" style="color:#d4af37">Scan</a><div class="card"><h2>QRIS {{ user['username'] }}</h2><small>{{ user['account_no'] }}</small><div id="qrcode" style="margin:20px auto;width:220px;height:220px"></div><input id="amountInput" type="number" placeholder="Nominal ex: 50000"><p>Scan untuk transfer ke <b>{{ user['username'] }}</b></p></div><script>
let user="{{ user['username'] }}";function makeQR(){let amt=document.getElementById('amountInput').value;let url=`${location.origin}/transfer?to=${user}`+(amt?`&amount=${amt}`:'');document.getElementById('qrcode').innerHTML="";new QRCode(document.getElementById("qrcode"),{text:url,width:220,height:220,colorDark:"#0a2540"});}document.getElementById('amountInput').addEventListener('input',makeQR);makeQR();
</script></body></html>
