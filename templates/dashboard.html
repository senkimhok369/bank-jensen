<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FINAL BOSS</title><style>body{margin:0;background:#050a14;color:white;font-family:sans-serif;padding:20px}.saldo{background:linear-gradient(135deg,#0a1931,#122c5a);border:2px solid #d4af37;border-radius:20px;padding:22px;max-width:400px;margin:auto;box-shadow:0 0 30px rgba(212,175,55,.5)}.btn{display:inline-block;padding:12px 18px;background:#d4af37;color:#0a2540;border-radius:12px;text-decoration:none;font-weight:700;margin:4px;font-size:13px}.mutasi{background:white;color:#0a2540;border-radius:15px;padding:15px;max-width:400px;margin:15px auto}.notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#d4af37;color:#0a2540;padding:14px 24px;border-radius:30px;font-weight:800;z-index:9999;display:none}</style></head><body><div id="notif" class="notif"></div><div class="saldo"><small style="color:#d4af37">LEVEL 5 FINAL BOSS - SALDO REKENING</small><h1>Rp {{ "{:,}".format(user['balance']).replace(',','.') }}</h1><small>{{ user['account_no'] }}</small><div style="margin-top:18px"><a class="btn" href="/transfer">Transfer</a><a class="btn" href="/scan">Scan</a><a class="btn" href="/qris">QRIS</a><a class="btn" href="/topup">Top Up</a><a class="btn" href="/history">History</a></div></div><div class="mutasi"><b>MUTASI TERAKHIR</b>{% for t in tx %}<p style="font-size:12px">{{ t['from_user'] }} -> {{ t['to_user'] }} Rp {{ t['amount'] }} - {{ t['note'] }}</p>{% endfor %}</div><audio id="ting" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3"></audio><script>{% if session.get('notify') %}let m="{{ session.pop('notify') }}";let e=document.getElementById('notif');e.innerText=m;e.style.display='block';document.getElementById('ting').play().catch(()=>{});if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(()=>e.style.display='none',4000);{% endif %}</script></body></html>
